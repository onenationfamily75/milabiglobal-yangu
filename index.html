    function escapeHtml(str) {
      if (!str) return '';
      return String(str)

        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');

    function getFilteredProducts() {
      const q = state.searchQuery.trim().toLowerCase();
      let list = PRODUCTS.filter(p => {
        if (state.selectedCategory !== 'all' && p.categorySlug !== state.selectedCategory) return false;
        if (state.stockFilter === 'on-sale' && !p.oldPrice) return false;
        if (q) {
          const hay = `${p.title} ${p.categoryName} ${p.slug}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      if (state.sortBy === 'price-asc') {
        list = [...list].sort((a, b) => a.price - b.price);
      } else if (state.sortBy === 'price-desc') {

            <li>
              <button type="button" onclick="window.milabiToggleCart(true)" class="flex flex-col items-center py-1 px-2 text-[#088178] font-bold">
                <span>Add to Cart (${cartCount})</span>
              </button>
            </li>
            <li>
              <button type="button" onclick="window.milabiNavigate('wishlist')" class="flex flex-col items-center py-1 px-2 ${state.view === 'wishlist' ? 'text-[#088178]' : ''}">
                <span>Wishlist</span>
              </button>
            </li>
            <li>
              <button type="button" onclick="window.milabiToggleCart(true)" class="flex flex-col items-center py-1 px-2 text-[#229a16] font-bold">
                <span>WhatsApp Order</span>
              </button>
            </li>
          </ul>
        </div>
      `;
    }

    function renderMainContent() {
      switch (state.view) {
        case 'shop':
          return renderInteractiveCatalogSection('Shop All Milabi Global Products');
        case 'categories':
          return renderCategoriesDirectoryView();
        case 'featured-walkers':
          return renderFeaturedWalkersView();
        case 'delivery-returns':
          return renderDeliveryReturnsView();
        case 'order-lookup':
          return renderOrderLookupView();
        case 'wishlist':
          return renderWishlistView();
        case 'account':
          return renderAccountView();
        case 'home':
        default:
          return renderHomeView();
      }
    }

    function renderApp() {
      const mount = document.getElementById('milabi-app');
      if (!mount) return;
      mount.innerHTML = `
        ${renderHeader()}
        <main>${renderMainContent()}</main>
        ${renderFooter()}
        ${renderMobileBottomBar()}
        <div id="milabi-modals-root">
          ${renderQuickViewModal()}
          ${renderCartDrawer()}
        </div>
        <div id="milabi-toast-root"></div>
      `;
      renderToastOnly();
    }

    function renderModalsOnly() {
      const m = document.getElementById('milabi-modals-root');
      if (!m) {
        renderApp();
        return;
      }
      m.innerHTML = `
        ${renderQuickViewModal()}
        ${renderCartDrawer()}
      `;
    }

    // Global Window Action Handlers
    window.milabiShowToast = showToast;

    window.milabiNavigate = function(viewName, scrollTop = true) {
      state.view = viewName;
      state.mobileMenuOpen = false;
      renderApp();
      if (scrollTop) window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.milabiToggleMobileMenu = function() {
      state.mobileMenuOpen = !state.mobileMenuOpen;
      renderApp();
    };

    window.milabiSelectCategory = function(catSlug, switchToCatalogScroll = true) {
      state.selectedCategory = catSlug || 'all';
      if (state.view !== 'home' && state.view !== 'shop') {
        state.view = 'shop';
      }
      renderApp();
      if (switchToCatalogScroll) {
        const el = document.getElementById('complete-catalog-section');
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      }
    };

    window.milabiSetStockFilter = function(filter) {
      state.stockFilter = filter;
      renderApp();
    };

    window.milabiSetSortBy = function(sort) {
      state.sortBy = sort;
      renderApp();
    };

    window.milabiResetFilters = function() {
      state.selectedCategory = 'all';
      state.searchQuery = '';
      state.stockFilter = 'all';
      state.sortBy = 'featured';
      renderApp();
    };

    window.milabiSetLimitedTab = function(tabId) {
      state.limitedTimeTab = tabId;
      renderApp();
    };

    window.milabiHandleSearchInput = function(val) {
      state.searchQuery = val;
    };

    window.milabiHandleSearchSubmit = function(e) {
      if (e) e.preventDefault();
      if (state.view !== 'home' && state.view !== 'shop') {
        state.view = 'shop';
      }
      renderApp();
      const el = document.getElementById('complete-catalog-section');
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    };

    window.milabiAddToCart = function(slug, qty = 1) {
      const p = productBySlug[slug];
      if (!p) return;
      const existing = state.cart.find(item => item.slug === slug);
      if (existing) {
        existing.qty += qty;
      } else {
        state.cart.push({ slug, qty });
      }
      state.lastConfirmedOrder = null;
      saveCart();
      renderApp();
      showToast(`Added "${p.title}" to cart`);
    };

    // Pressing WhatsApp on any product opens Add to Cart + View Details + Buyer Delivery Details Modal before confirming on WhatsApp
    window.milabiOpenWhatsAppOrderModal = function(slug) {
      const p = productBySlug[slug];
      if (!p) return;
      const existing = state.cart.find(item => item.slug === slug);
      if (!existing) {
        state.cart.push({ slug, qty: 1 });
        saveCart();
      }
      state.quickViewSlug = slug;
      state.quickViewQty = existing ? existing.qty : 1;
      renderApp();
      showToast('Review product details & enter buyer delivery details before confirming on WhatsApp.');
    };

    window.milabiUpdateCartQty = function(slug, delta) {
      const idx = state.cart.findIndex(item => item.slug === slug);
      if (idx === -1) return;
      state.cart[idx].qty += delta;
      if (state.cart[idx].qty <= 0) {
        state.cart.splice(idx, 1);
      }
      saveCart();
      renderApp();
    };

    window.milabiRemoveFromCart = function(slug) {
      state.cart = state.cart.filter(item => item.slug !== slug);
      saveCart();
      renderApp();
    };

    window.milabiToggleCart = function(open) {
      state.cartDrawerOpen = Boolean(open);
      renderModalsOnly();
    };

    window.milabiToggleWishlist = function(slug) {
      const p = productBySlug[slug];
      if (state.wishlist.includes(slug)) {
        state.wishlist = state.wishlist.filter(s => s !== slug);
        showToast(`Removed "${p ? p.title : slug}" from wishlist`);
      } else {
        state.wishlist.push(slug);
        showToast(`Saved "${p ? p.title : slug}" to wishlist`);
      }
      saveWishlist();
      renderApp();
    };

    window.milabiOpenQuickView = function(slug) {
      state.quickViewSlug = slug;
      state.quickViewQty = 1;
      renderModalsOnly();
    };

    window.milabiCloseQuickView = function() {
      state.quickViewSlug = null;
      renderModalsOnly();
    };

    window.milabiChangeQuickQty = function(delta) {
      state.quickViewQty = Math.max(1, state.quickViewQty + delta);
      renderModalsOnly();
    };

    window.milabiUpdateCheckoutField = function(field, value) {
      state.checkoutForm[field] = value;
    };

    // Submit directly from the Product Details + Buyer Delivery Details Modal
    window.milabiSubmitDirectWhatsAppOrder = function(e, slug) {
      if (e) e.preventDefault();
      const p = productBySlug[slug];
      if (!p) return;
      const qty = state.quickViewQty || 1;
      const existing = state.cart.find(item => item.slug === slug);
      if (existing) {
        existing.qty = qty;
      } else {
        state.cart.push({ slug, qty });
      }
      saveCart();
      state.quickViewSlug = null;
      state.cartDrawerOpen = true;
      window.milabiSubmitWhatsAppCheckout();
    };

    window.milabiSubmitWhatsAppCheckout = function(e) {
      if (e) e.preventDefault();
      if (state.cart.length === 0) return;
      const orderId = '#MG-' + Math.floor(10000 + Math.random() * 90000);
      const total = getCartTotal();
      const dateStr = new Date().toLocaleString('en-KE', { dateStyle: 'medium', timeStyle: 'short' });

      const itemLines = state.cart.map((item, idx) => {
        const p = productBySlug[item.slug];
        if (!p) return '';
        return `${idx + 1}. ${p.title} (x${item.qty}) - ${formatKES(p.price * item.qty)}\n   Product URL: ${p.productUrl}`;
      }).filter(Boolean);

      const messageText = [
        `*NEW ORDER CONFIRMATION - MILABI GLOBAL*`,
        `Order Ref: ${orderId}`,
        `Date: ${dateStr}`,
        ``,
        `*Buyer & Delivery Details:*`,
        `• Buyer Name: ${state.checkoutForm.name}`,
        `• Phone / WhatsApp: ${state.checkoutForm.phone}`,
        `• County / City: ${state.checkoutForm.county}`,
        `• Delivery Address: ${state.checkoutForm.address}`,
        `• Payment Method: ${state.checkoutForm.paymentMethod}`,
        state.checkoutForm.notes ? `• Delivery Notes: ${state.checkoutForm.notes}` : null,
        ``,
        `*Ordered Items:*`,
        ...itemLines,
        ``,
        `*TOTAL AMOUNT: ${formatKES(total)}*`,
        ``,
        `Please confirm my order and delivery schedule.`
      ].filter(v => v !== null).join('\n');

      const whatsappUrl = `https://wa.me/${WHATSAPP_CONFIRMATION_NUMBER}?text=${encodeURIComponent(messageText)}`;

      const orderRecord = {
        orderId,
        date: dateStr,
        customerName: state.checkoutForm.name,
        phone: state.checkoutForm.phone,
        county: state.checkoutForm.county,
        address: state.checkoutForm.address,
        notes: state.checkoutForm.notes,
        paymentMethod: state.checkoutForm.paymentMethod,
        items: [...state.cart],
        total,
        messageText,
        whatsappUrl
      };

      state.savedOrders.unshift(orderRecord);
      saveOrders();
      state.lastConfirmedOrder = orderRecord;
      state.cart = [];
      saveCart();
      renderApp();
      showToast(`Order ${orderId} confirmed! Opening WhatsApp ${WHATSAPP_DISPLAY}...`);

      try {
        const a = document.createElement('a');
        a.href = whatsappUrl;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch (err) {
        // Fallback link is shown inside the confirmation card
      }
    };

    window.milabiCopyOrderSummary = function() {
      if (!state.lastConfirmedOrder) return;
      navigator.clipboard.writeText(state.lastConfirmedOrder.messageText).then(() => {
        showToast('Order summary copied to clipboard!');
      });
    };

    window.milabiHandleOrderLookup = function(e) {
      if (e) e.preventDefault();
      const refInput = document.getElementById('lookup-order-ref');
      const contactInput = document.getElementById('lookup-contact');
      const ref = refInput ? refInput.value.trim() : '';
      const contact = contactInput ? contactInput.value.trim() : '';
      const found = state.savedOrders.find(o => o.orderId.toLowerCase() === ref.toLowerCase());
      if (found) {
        state.lookupResult = `Order ${found.orderId} for ${found.customerName} (${formatKES(found.total)}) is confirmed and awaiting dispatch. Confirmation WhatsApp: ${WHATSAPP_DISPLAY}.`;
      } else {
        state.lookupResult = `Order reference "${ref}" logged for ${contact}. Click "Confirm via WhatsApp (${WHATSAPP_DISPLAY})" to get real-time dispatch updates from our team.`;
      }
      renderApp();
    };

    window.milabiLookupViaWhatsApp = function() {
      const refInput = document.getElementById('lookup-order-ref');
      const contactInput = document.getElementById('lookup-contact');
      const ref = refInput && refInput.value.trim() ? refInput.value.trim() : 'My Order';
      const contact = contactInput && contactInput.value.trim() ? contactInput.value.trim() : '';
      const msg = `Hello Milabi Global! Please share a status update for Order Reference: ${ref} (${contact}).`;
      const url = `https://wa.me/${WHATSAPP_CONFIRMATION_NUMBER}?text=${encodeURIComponent(msg)}`;
      const a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    };

    // Initialize Storefront
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', renderApp);
    } else {
      renderApp();
    }

  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
